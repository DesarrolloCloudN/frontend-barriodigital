<div class="dashboard-container">
  <h1>BarrioDigital</h1>

  <!-- Muestra el nombre del usuario logueado, si existe. -->
  @if (account) {
    <p>
      Usuario:
      <strong>{{ account.name || account.username }}</strong>
    </p>
  }

  <!-- Muestra los roles que trae el token, o un aviso si no tiene ninguno. -->
  @if (roles.length > 0) {
    <p>
      Rol(es):
      <strong>{{ roles.join(', ') }}</strong>
    </p>
  } @else {
    <p><strong>Sin roles asignados en el token.</strong></p>
  }

  <hr />

  <h2>Accesos rápidos</h2>

  <nav class="accesos">
    <a class="btn btn-primary" routerLink="/requests">Trámites</a>

    <!-- El enlace al catálogo solo aparece para Admin o Funcionario. -->
    @if (puedeVerCatalogo) {
      <a class="btn btn-secondary" routerLink="/catalog">Catálogo de trámites</a>
    }
  </nav>

  <hr />

  <button type="button" class="btn btn-secondary" (click)="logout()">Cerrar sesión</button>
</div>
